<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff">
    <title>codeq drop</title>
    <script>
        (() => {
            try {
                const pref = localStorage.getItem('codeqDrop.theme') || 'system';
                const dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.dataset.theme = dark ? 'dark' : 'light';
            } catch (e) { }
            document.documentElement.classList.add('auth-pending');
            setTimeout(() => document.documentElement.classList.remove('auth-pending'), 15000);
        })();
    </script>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/welcome.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div id="auth" hidden>
        <div class="controls fixed" data-controls></div>

        <header class="w-header">
            <div class="brand"><span class="brand-mark"><i class="bx bx-transfer-alt"></i></span><span class="brand-name">codeq drop</span></div>
        </header>

        <section class="w-sec w-intro">
            <h1 class="w-title"><span data-i="w_h1a"></span><span class="acc" data-i="w_h1b"></span></h1>
            <p class="w-lead" data-i="lead"></p>
        </section>

        <section class="w-sec pv" aria-hidden="true">
            <div class="pv-side">
                <span class="on"><i class="bx bx-layer"></i><span data-i="fl_all"></span></span>
                <span><i class="bx bx-text"></i><span data-i="fl_text"></span></span>
                <span><i class="bx bx-link"></i><span data-i="fl_link"></span></span>
                <span><i class="bx bx-file"></i><span data-i="fl_file"></span></span>
            </div>
            <div class="pv-list">
                <div class="pv-row" style="--n:0"><i class="bx bx-image"></i><div><b>IMG_2041.jpg</b><small>Android · 2.4 MB · <span data-i="now"></span></small></div><i class="live"></i></div>
                <div class="pv-row" style="--n:1"><i class="bx bx-link"></i><div><b>figma.com/design/k3Xq…</b><small>iPhone · <span data-i="m_min"></span></small></div></div>
                <div class="pv-row" style="--n:2"><i class="bx bx-text"></i><div><b>wi-fi: sunny-fox-4417</b><small>Mac · <span data-i="m_hour"></span> · <span data-i="once"></span></small></div></div>
            </div>
        </section>

        <ul class="w-sec w-feat">
            <li class="rv" style="--i:0"><i class="bx bx-bolt-circle"></i><strong data-i="f1"></strong><span data-i="f1d"></span></li>
            <li class="rv" style="--i:1"><i class="bx bx-timer"></i><strong data-i="f2"></strong><span data-i="f2d"></span></li>
            <li class="rv" style="--i:2"><i class="bx bx-copy-alt"></i><strong data-i="f3"></strong><span data-i="f3d"></span></li>
            <li class="rv" style="--i:3"><i class="bx bx-image"></i><strong data-i="f4"></strong><span data-i="f4d"></span></li>
            <li class="rv" style="--i:4"><i class="bx bx-share-alt"></i><strong data-i="f5"></strong><span data-i="f5d"></span></li>
            <li class="rv" style="--i:5"><i class="bx bx-lock-alt"></i><strong data-i="f6"></strong><span data-i="f6d"></span></li>
        </ul>

        <section class="w-sec demo rv">
            <span class="kicker" data-i="dm_k"></span>
            <h2 data-i="dm_t"></h2>
            <p data-i="dm_d"></p>
            <div class="demo-card">
                <div class="dev">
                    <div class="dev-bar"><i class="bx bx-mobile"></i><span data-i="dm_a"></span></div>
                    <textarea id="demoIn" rows="3" maxlength="160" data-ip="dm_ph"></textarea>
                    <div class="chips">
                        <button class="chip" data-chip="link"><i class="bx bx-link"></i><span data-i="dm_c1"></span></button>
                        <button class="chip" data-chip="pass"><i class="bx bx-key"></i><span data-i="dm_c2"></span></button>
                        <button class="chip" data-chip="photo"><i class="bx bx-image"></i><span data-i="dm_c3"></span></button>
                    </div>
                    <div class="opts">
                        <span data-i="keep"></span>
                        <div id="demoTtl" class="seg">
                            <button class="on" data-ttl="">∞</button>
                            <button data-ttl="3600" data-i="t1h"></button>
                            <button data-ttl="burn" data-i="tonce"></button>
                        </div>
                    </div>
                    <button id="demoSend" class="main-btn"><span data-i="send"></span><i class="bx bx-up-arrow-alt"></i></button>
                </div>
                <div class="demo-arrow" id="demoArrow"><i class="bx bx-right-arrow-alt"></i></div>
                <div class="dev">
                    <div class="dev-bar">
                        <i class="bx bx-laptop"></i><span data-i="dm_b"></span>
                        <label class="auto"><span data-i="auto"></span><button id="demoAuto" class="switch" role="switch" aria-checked="true"><span></span></button></label>
                    </div>
                    <ul id="demoFeed">
                        <li class="dm-row"><i class="bx bx-image"></i><div><b>IMG_2041.jpg</b><small>Android · 2.4 MB · <span data-i="m_hour"></span></small></div></li>
                        <li class="dm-row"><i class="bx bx-link"></i><div><b>https://www.figma.com/design/k3Xq</b><small>iPhone · <span data-i="m_min"></span></small></div><button class="icon-btn" data-dm="copy"><i class="bx bx-copy"></i></button></li>
                    </ul>
                    <p id="demoToast" class="dm-toast"></p>
                </div>
            </div>
        </section>

        <footer class="w-sec w-foot">
            <a href="/terms" data-i="foot_terms"></a>
            <a href="/privacy" data-i="foot_priv"></a>
            <span>© codeq drop</span>
        </footer>

        <aside class="auth-side">
            <div class="auth">
                <span class="kicker" data-i="a_k"></span>
                <h2 data-i="a_t"></h2>
                <p data-i="a_d"></p>
                <div class="prov-list">
                    <button class="prov" data-provider="google" aria-label="Google"><i class="bx bxl-google"></i></button>
                    <button class="prov" data-provider="github" aria-label="GitHub"><i class="bx bxl-github"></i></button>
                    <button class="prov" data-provider="discord" aria-label="Discord"><i class="bx bxl-discord-alt"></i></button>
                </div>
                <p id="hint"></p>
                <p class="terms"><span data-i="agree"></span> <a href="/terms" data-i="terms_l"></a> <span data-i="and"></span> <a href="/privacy" data-i="privacy_l"></a>.</p>
            </div>
        </aside>
    </div>

    <div id="app" hidden>
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="brand"><span class="brand-mark"><i class="bx bx-transfer-alt"></i></span><span class="brand-name">codeq drop</span></div>
                <button id="newBtn" class="main-btn"><i class="bx bx-plus"></i><span data-i="new_t"></span></button>
                <label class="search-wrap"><i class="bx bx-search"></i><input id="q" type="text" autocomplete="off" data-ip="q_ph"></label>
            </div>
            <div class="side-scroll">
                <h2 class="section-title" data-i="fl_t"></h2>
                <nav id="filters" class="nav">
                    <button class="on" data-f="all"><i class="bx bx-layer"></i><span data-i="fl_all"></span><em id="c_all">0</em></button>
                    <button data-f="text"><i class="bx bx-text"></i><span data-i="fl_text"></span><em id="c_text">0</em></button>
                    <button data-f="link"><i class="bx bx-link"></i><span data-i="fl_link"></span><em id="c_link">0</em></button>
                    <button data-f="file"><i class="bx bx-file"></i><span data-i="fl_file"></span><em id="c_file">0</em></button>
                    <button data-f="pinned"><i class="bx bx-pin"></i><span data-i="fl_pin"></span><em id="c_pinned">0</em></button>
                </nav>
                <h2 class="section-title" data-i="dv_t"></h2>
                <ul id="devices" class="devs"></ul>
            </div>
            <div class="sidebar-footer">
                <span class="avatar"><i class="bx bx-user"></i></span>
                <span id="who"></span>
                <button id="out" class="icon-btn"><i class="bx bx-log-out"></i></button>
            </div>
        </aside>

        <main class="main" id="main">
            <header class="topbar" id="topbar">
                <h1 data-i="list_t"></h1>
                <div class="controls" data-controls></div>
            </header>
            <div class="content">
                <div class="col">
                    <section class="card composer">
                        <h2 data-i="new_t"></h2>
                        <textarea id="text" rows="3" data-ip="ph"></textarea>
                        <div class="opts">
                            <span data-i="keep"></span>
                            <div id="ttl" class="seg">
                                <button class="on" data-ttl="">∞</button>
                                <button data-ttl="3600" data-i="t1h"></button>
                                <button data-ttl="86400" data-i="t1d"></button>
                                <button data-ttl="burn" data-i="tonce"></button>
                            </div>
                        </div>
                        <div class="opts">
                            <span data-i="auto"></span>
                            <button id="auto" class="switch" role="switch" aria-checked="false"><span></span></button>
                        </div>
                        <div class="row">
                            <button id="pick" class="ghost-btn"><i class="bx bx-paperclip"></i><span data-i="file"></span></button>
                            <input id="file" type="file" multiple hidden>
                            <button id="send" class="main-btn"><span data-i="send"></span><i class="bx bx-up-arrow-alt"></i></button>
                        </div>
                    </section>
                    <ul id="list"></ul>
                    <p id="empty" class="empty"></p>
                </div>
                <aside class="info">
                    <section class="card">
                        <h3 data-i="st_t"></h3>
                        <div class="stat"><b id="stN">0</b><span data-i="st_n"></span></div>
                        <div class="stat"><b id="stS">0 KB</b><span data-i="st_s"></span></div>
                    </section>
                    <section class="card">
                        <h3 data-i="kb_t"></h3>
                        <ul class="keys">
                            <li><kbd>/</kbd><span data-i="k_search"></span></li>
                            <li><kbd>Ctrl</kbd><kbd>Enter</kbd><span data-i="k_send"></span></li>
                            <li><kbd>Ctrl</kbd><kbd>V</kbd><span data-i="k_paste"></span></li>
                            <li><kbd>Esc</kbd><span data-i="k_esc"></span></li>
                        </ul>
                    </section>
                    <section class="card">
                        <h3 data-i="tip_t"></h3>
                        <p class="tip" data-i="tip_d"></p>
                    </section>
                </aside>
            </div>
        </main>
    </div>

    <p id="msg" class="toast"></p>
    <div id="drop" class="dropzone"><div><i class="bx bx-cloud-upload"></i><h2 data-i="drop_t"></h2></div></div>

    <script type="module" src="/app.js"></script>
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
