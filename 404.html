<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f7f8fa">
    <meta name="robots" content="noindex">
    <title>Страница не найдена ― codeq notes</title>
    <link rel="icon" href="/иконка заметки.svg" type="image/svg+xml">
    <script defer src="https://codeqanalytics.onrender.com/tracker/a.js"
    data-site="d1b5ca24-128d-4778-b5cf-6532bc7e6aee"
    data-api="https://zlxugwlfmzlrvsqovnyd.supabase.co/functions/v1/collect"></script>
    <script>
        (() => {
            try {
                const saved = localStorage.getItem("startNotes.theme") || "system";
                const theme = saved === "system"
                    ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
                    : saved;
                document.documentElement.setAttribute("data-theme", theme);
            } catch {}
        })();
    </script>
    <style>
        @font-face {
            font-family: 'PT Root UI';
            src: url(/pt-root-ui_vf.woff);
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Manrope';
            src: url(/Manrope-VariableFont_wght.ttf);
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'JetBrains Mono';
            src: url(/JetBrainsMono[wght].ttf);
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            color-scheme: light;
            --background: #f7f8fa;
            --panel: #ffffff;
            --text: #1d2024;
            --desc: #6b7280;
            --border: #e7eaee;
            --accent: #fbd438;
            --accent-text: #1d2024;
            --accent-subtle: rgba(251, 212, 56, 0.16);
            --danger: #e2504a;
            --icon-filter: none;
            --shadow-md: 0 1px 2px rgba(29, 32, 36, 0.04), 0 10px 24px rgba(29, 32, 36, 0.08);
            --radius-sm: 10px;
            --radius-lg: 22px;
            --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --background: #16181b;
            --panel: #1d2024;
            --text: #f3f4f6;
            --desc: #a5acb8;
            --border: #30343b;
            --accent: #6b8dff;
            --accent-text: #ffffff;
            --accent-subtle: rgba(107, 141, 255, 0.14);
            --icon-filter: brightness(0) invert(1);
            --shadow-md: 0 1px 2px rgba(0, 0, 0, 0.2), 0 10px 24px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 40px 20px;
            overflow-x: hidden;
            background: var(--background);
            color: var(--text);
            font-family: 'Manrope', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Open Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        .watermark {
            position: fixed;
            right: -9vmin;
            bottom: -12vmin;
            z-index: -1;
            width: 70vmin;
            height: 70vmin;
            background-color: var(--accent);
            opacity: 0.13;
            -webkit-mask: url('/логотип заметки.svg') center / contain no-repeat;
            mask: url('/логотип заметки.svg') center / contain no-repeat;
            transform: rotate(-14deg);
            pointer-events: none;
            animation: watermark-in 1.4s var(--ease-out) backwards;
        }

        .sheet {
            width: 100%;
            max-width: 640px;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            background: var(--panel);
            box-shadow: var(--shadow-md);
            animation: rise 0.7s var(--ease-out) backwards;
        }

        .bar {
            display: flex;
            align-items: center;
            padding: 14px 24px;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            color: var(--text);
            font-family: 'PT Root UI', system-ui, sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.01em;
            text-decoration: none;
            user-select: none;
        }

        .brand img {
            width: 22px;
            height: 22px;
            filter: var(--icon-filter);
            pointer-events: none;
        }

        .body {
            padding: 36px 36px 32px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 18px;
        }

        .tag {
            padding: 3px 10px;
            border-radius: 999px;
            background: var(--accent-subtle);
            color: var(--accent);
            font-size: 11.5px;
            font-weight: 700;
        }

        .title {
            margin-bottom: 14px;
            font-family: 'PT Root UI', system-ui, sans-serif;
            font-size: clamp(30px, 6vw, 44px);
            font-weight: 700;
            line-height: 1.08;
            letter-spacing: -0.035em;
        }

        .text {
            max-width: 32em;
            margin-bottom: 24px;
            color: var(--desc);
            font-size: 14.5px;
            line-height: 1.7;
        }

        .todo {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-bottom: 30px;
            list-style: none;
        }

        .todo-item {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 36px;
            padding: 4px 0 4px 32px;
            color: var(--text);
            font-family: inherit;
            font-size: 14.5px;
            text-align: left;
            text-decoration: line-through;
            text-decoration-color: transparent;
            text-decoration-thickness: 1px;
            background: none;
            border: 0;
            cursor: pointer;
            transition: color 0.3s var(--ease-out), text-decoration-color 0.3s var(--ease-out);
        }

        .todo-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 19px;
            height: 19px;
            border: 1.5px solid var(--border);
            border-radius: 5px;
            background: var(--panel);
            transform: translateY(-50%);
            transition: background-color 0.2s var(--ease), border-color 0.2s var(--ease);
        }

        .todo-item:hover::before {
            border-color: var(--accent);
        }

        .todo-item::after {
            content: '';
            position: absolute;
            left: 9.5px;
            top: 50%;
            width: 5px;
            height: 9px;
            border: solid var(--accent-text);
            border-width: 0 1.98px 1.98px 0;
            transform: translate(-50%, -60%) rotate(45deg);
            opacity: 0;
}

        .todo-item[aria-checked="true"] {
            color: var(--desc);
            text-decoration-color: var(--desc);
        }

        .todo-item[aria-checked="true"]::before {
            background: var(--accent);
            border-color: var(--accent);
            animation: check-pop 0.3s var(--ease-out);
        }

        .todo-item[aria-checked="true"]::after {
            opacity: 1;
            animation: draw-check 0.35s var(--ease-out) forwards;
        }

        .todo-item:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: 6px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 44px;
            padding: 0 24px;
            border: 1px solid var(--accent);
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: var(--accent-text);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            user-select: none;
            cursor: pointer;
            transition: filter 0.15s var(--ease), border-color 0.15s var(--ease), color 0.15s var(--ease);
        }

        .btn:hover {
            filter: brightness(1.05);
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .btn[hidden] {
            display: none;
        }

        .btn.ghost {
            border-color: var(--border);
            background: transparent;
            color: var(--desc);
        }

        .btn.ghost:hover {
            border-color: var(--accent);
            color: var(--text);
            filter: none;
        }

        .foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 24px;
            border-top: 1px solid var(--border);
            color: var(--desc);
            font-size: 12px;
        }

        .status {
            display: flex;
            flex-shrink: 0;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .status::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--danger);
        }

        .path {
            min-width: 0;
            overflow: hidden;
            font-family: var(--mono);
            font-size: 11.5px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes watermark-in {
            from {
                opacity: 0;
                transform: rotate(-34deg) scale(0.9);
            }
            to {
                opacity: 0.13;
                transform: rotate(-14deg);
            }
        }

        @keyframes check-pop {
            0%   { transform: translateY(-50%) scale(1); }
            40%  { transform: translateY(-50%) scale(0.86); }
            100% { transform: translateY(-50%) scale(1); }
        }

        @keyframes draw-check {
            0%   { clip-path: inset(calc(100% - 2.5px) 100% 0 0); }
            40%  { clip-path: inset(calc(100% - 2.5px) 0 0 0); }
            100% { clip-path: inset(0 0 0 0); }
        }

        @media (max-width: 560px) {
            body {
                align-items: flex-start;
                padding: 24px 14px;
            }

            .watermark {
                right: -26vmin;
                bottom: -18vmin;
                width: 96vmin;
                height: 96vmin;
            }

            .bar {
                padding: 12px 18px;
            }

            .body {
                padding: 26px 20px 24px;
            }

            .foot {
                padding: 12px 18px;
            }

            .btn {
                flex: 1 1 140px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .sheet,
            .watermark,
            .todo-item[aria-checked="true"]::before,
            .todo-item[aria-checked="true"]::after {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div class="watermark" aria-hidden="true"></div>

    <main class="sheet">
        <div class="bar">
            <a href="/" class="brand">
                <img src="/логотип заметки.svg" alt="">
                <span>codeq notes</span>
            </a>
        </div>

        <div class="body">
            <div class="tags">
                <span class="tag">#404</span>
                <span class="tag" data-text="tag">#нет-такой-страницы</span>
            </div>
            <h1 class="title" data-text="title">Страница не найдена</h1>
            <p class="text" data-text="text">Мы искали везде, но по этому адресу ничего нет. Возможно, ссылка устарела или в адресе опечатка.</p>

            <ul class="todo">
                <li><button type="button" class="todo-item" role="checkbox" aria-checked="false" data-text="todo1">Проверить адрес на опечатки</button></li>
                <li><button type="button" class="todo-item" role="checkbox" aria-checked="false" data-text="todo2">Не паниковать: все заметки на месте</button></li>
                <li><button type="button" class="todo-item" role="checkbox" aria-checked="false" data-text="todo3">Вернуться к заметкам</button></li>
            </ul>

            <div class="actions">
                <a href="/" class="btn" data-text="home">К заметкам</a>
                <button type="button" class="btn ghost" id="back" data-text="back" hidden>Назад</button>
            </div>
        </div>

        <div class="foot">
            <span class="status" data-text="status">Ошибка 404</span>
            <span class="path" id="path"></span>
        </div>
    </main>

    <script>
        (() => {
            const EN = {
                tag: '#no-such-page',
                title: 'Page not found',
                text: 'We looked everywhere, but there’s nothing at this address. The link may be outdated or the address may have a typo.',
                todo1: 'Check the address for typos',
                todo2: 'Don’t panic: all your notes are safe',
                todo3: 'Go back to your notes',
                home: 'Back to notes',
                back: 'Go back',
                status: 'Error 404'
            };

            let lang = null;
            try {
                lang = localStorage.getItem('startNotes.language');
            } catch {}
            if (lang !== 'ru' && lang !== 'en') {
                lang = (navigator.language || '').toLowerCase().startsWith('ru') ? 'ru' : 'en';
            }
            if (lang === 'en') {
                document.documentElement.lang = 'en';
                document.title = 'Page not found ― codeq notes';
                document.querySelectorAll('[data-text]').forEach(node => {
                    const value = EN[node.dataset.text];
                    if (value)
                        node.textContent = value;
                });
            }

            const dark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.querySelector('meta[name="theme-color"]').content = dark ? '#16181b' : '#f7f8fa';

            let path = '/';
            try {
                path = decodeURIComponent(location.pathname);
            } catch {
                path = location.pathname;
            }
            document.getElementById('path').textContent = path;

            document.querySelectorAll('.todo-item').forEach(item => {
                item.addEventListener('click', () => {
                    item.setAttribute('aria-checked', item.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
                });
            });

            if (history.length > 1) {
                const back = document.getElementById('back');
                back.hidden = false;
                back.addEventListener('click', () => history.back());
            }
        })();
    </script>
</body>
</html>
